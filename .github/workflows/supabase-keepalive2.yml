# Mantiene activos los proyectos gratis de Supabase (se pausan tras ~7 días sin uso).
# Todos los días llama a una función que actualiza una fila (una escritura real,
# que Supabase sí cuenta como actividad; una lectura sola no alcanzaba).
#
# Configurar en GitHub: Settings → Secrets and variables → Actions → New repository secret
#   MATERIA_URL  = https://vxmijowqzvxiztrspdrz.supabase.co
#   MATERIA_KEY  = clave "Publishable key" (sb_publishable_...)  — nunca la secret
# En cada proyecto hay que crear antes la función keepalive_ping() (ver SQL en el chat).
# Para sumar otro cliente, agregar sus dos secrets y una línea en "matrix".

name: Supabase keepalive

on:
  schedule:
    - cron: "17 12 * * *"     # todos los días 09:17 (hora Argentina)
  workflow_dispatch: {}        # botón "Run workflow" para probar a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: materia-print
            url_secret: MATERIA_URL
            key_secret: MATERIA_KEY

          # - name: mumha
          #   url_secret: MUMHA_URL
          #   key_secret: MUMHA_KEY
          # - name: quemaspues
          #   url_secret: QMP_URL
          #   key_secret: QMP_ANON_KEY
    steps:
      - name: Consultar ${{ matrix.name }}
        env:
          SB_URL: ${{ secrets[matrix.url_secret] }}
          SB_KEY: ${{ secrets[matrix.key_secret] }}
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            "$SB_URL/rest/v1/rpc/keepalive_ping" \
            -H "apikey: $SB_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; head -c 200 /tmp/out.json; echo
          test "$code" = "200" -o "$code" = "204"

  # GitHub desactiva los workflows programados si el repo pasa 60 días sin commits.
  # Este paso hace un commit vacío una vez por mes para evitarlo.
  keep-repo-active:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Commit mensual
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 30 ]; then
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          else
            echo "Hubo actividad hace menos de 30 días; no hace falta commit."
          fi
